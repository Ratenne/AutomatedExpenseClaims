
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>영수증 OCR 엑셀 변환 | RAVIRGO</title>
  <meta name="description"
        content="영수증 이미지를 업로드해 내역을 추출하고 엑셀로 정리하는 무료 도구입니다.">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    main {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .fallback {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #fff;
      padding: 24px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .fallback.visible {
      display: flex;
    }

    .fallback p {
      color: #64748b;
      line-height: 1.6;
    }

    .fallback a {
      color: #2563eb;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main>
    <iframe
      id="ocrFrame"
      src="https://ratenne-automatedexpenseclaim.hf.space/"
      title="RAVIRGO 영수증 OCR"
      allow="clipboard-read; clipboard-write">
    </iframe>

    <div id="fallback" class="fallback" role="alert">
      <h2>영수증 OCR 화면을 불러오지 못했습니다.</h2>

      <p>
        서비스가 일시적으로 응답하지 않거나
        서버가 시작 중일 수 있습니다.
      </p>

      <p>
        <a
          href="https://ratenne-automatedexpenseclaim.hf.space/"
          target="_blank"
          rel="noopener noreferrer">
          영수증 OCR 직접 열기
        </a>
      </p>
    </div>
  </main>

  <script>
    const iframe = document.getElementById("ocrFrame");
    const fallback = document.getElementById("fallback");

    const TIMEOUT = 45000;
    let loaded = false;

    function showFallback() {
      if (loaded) return;
      fallback.classList.add("visible");
    }

    function hideFallback() {
      fallback.classList.remove("visible");
    }

    // iframe 로딩 시간 초과
    const timeoutId = setTimeout(() => {
      showFallback();
    }, TIMEOUT);

    // iframe 로드 이벤트
    iframe.addEventListener("load", () => {
      loaded = true;
      clearTimeout(timeoutId);
      hideFallback();
    });

    // iframe 오류 이벤트
    iframe.addEventListener("error", () => {
      showFallback();
    });
  </script>
</body>
</html>
